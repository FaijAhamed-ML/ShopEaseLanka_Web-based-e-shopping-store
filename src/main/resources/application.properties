spring.application.name=ShopEaseLanka
server.port=8080

# Database Configuration (Port 3307 local default)
spring.datasource.url=jdbc:mysql://localhost:3306/shopease_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Web & Static Resources
spring.web.resources.static-locations=classpath:/static/

# Jackson JSON formatting
spring.jackson.serialization.indent-output=true

#Allow data.sql seeding
spring.sql.init.mode=always

# SQL scripts are split per module (each member owns their own files)
spring.sql.init.schema-locations=classpath:db/schema/00-reset.sql,\
classpath:db/schema/01-user.sql,\
classpath:db/schema/02-product.sql,\
classpath:db/schema/03-inventory.sql,\
classpath:db/schema/04-order.sql,\
classpath:db/schema/05-delivery.sql,\
classpath:db/schema/06-review.sql
spring.sql.init.data-locations=classpath:db/seed/01-user.sql,\
classpath:db/seed/02-product.sql,\
classpath:db/seed/03-inventory.sql,\
classpath:db/seed/04-order.sql,\
classpath:db/seed/05-delivery.sql,\
classpath:db/seed/06-review.sql
