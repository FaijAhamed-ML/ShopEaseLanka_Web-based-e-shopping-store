<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ShopEase Lanka Staff Back-Office Portal - Authorized employee login for operations, fulfillment, logistics, catalog, and CX management.">
  <title>Staff Back-Office Portal | ShopEase Lanka</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="/css/styles.css">
  <script>
    (function() {
      const saved = localStorage.getItem('shopease_theme') || localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    })();
  </script>
  <style>
    body {
      background: radial-gradient(circle at 50% 15%, #10261d 0%, #070e0b 85%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      padding: 24px 16px;
      color: #f5f2eb;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .staff-login-container {
      width: 100%;
      max-width: 480px;
    }

    .staff-branding-icon {
      width: 56px;
      height: 56px;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 10px;
      color: #d4af37;
      transition: all 0.2s ease;
    }

    .staff-branding-title {
      color: #f5f2eb;
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: 0.02em;
      transition: color 0.2s ease;
    }

    .staff-branding-sub {
      color: #a8a296;
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: color 0.2s ease;
    }

    .staff-card {
      background: #0d1a15;
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.75), 0 0 20px rgba(212, 175, 55, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.25);
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .staff-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(212, 175, 55, 0.12);
      color: #d4af37;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 9999px;
      margin-bottom: 12px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      transition: all 0.2s ease;
    }

    .staff-version-tag {
      font-size: 0.78rem;
      color: #8a8475;
      transition: color 0.2s ease;
    }

    .staff-card-title {
      font-size: 1.4rem;
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      margin: 14px 0 6px 0;
      color: #f5f2eb;
      transition: color 0.2s ease;
    }

    .staff-card-desc {
      color: #c4beaf;
      font-size: 0.86rem;
      margin-bottom: 22px;
      line-height: 1.5;
      transition: color 0.2s ease;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.86rem;
      font-weight: 600;
      color: #c4beaf;
      margin-bottom: 6px;
      transition: color 0.2s ease;
    }

    .form-group input,
    .password-input-wrapper input {
      width: 100%;
      background: #070e0b;
      border: 1.5px solid rgba(212, 175, 55, 0.25);
      border-radius: 8px;
      font-size: 0.95rem;
      color: #f5f2eb;
      transition: all 0.2s ease;
      box-sizing: border-box;
      font-family: inherit;
    }

    .form-group input {
      padding: 12px 14px;
    }

    .password-input-wrapper input {
      padding: 12px 44px 12px 14px;
    }

    .form-group input::placeholder,
    .password-input-wrapper input::placeholder {
      color: #64748B;
    }

    .form-group input:focus,
    .password-input-wrapper input:focus {
      outline: none;
      border-color: #d4af37;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
    }

    /* Password Input Wrapper with Show/Hide Toggle */
    .password-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .password-toggle-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8a8475;
      transition: color 0.15s ease, background-color 0.15s ease;
      z-index: 2;
    }

    .password-toggle-btn:hover {
      color: #d4af37;
      background: rgba(212, 175, 55, 0.1);
    }

    .password-toggle-btn:focus-visible {
      outline: 2px solid #d4af37;
      outline-offset: 1px;
    }

    .eye-icon {
      width: 19px;
      height: 19px;
      display: block;
    }

    .alert-box {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
      line-height: 1.45;
    }

    .alert-danger {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    .return-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #94a3b8;
      font-size: 0.85rem;
      text-decoration: none;
      margin-top: 20px;
      transition: color 0.15s ease;
    }

    .return-link:hover {
      color: #ffffff;
    }
  
    /* Theme-Adaptive Styles for Staff Login */
    [data-theme="light"] body {
      background: radial-gradient(circle at 50% 15%, #FBF9F4 0%, #EFE8DA 85%);
      color: #141A17;
    }
    [data-theme="light"] .staff-card {
      background: #FFFFFF;
      border: 1px solid rgba(168, 126, 34, 0.25);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
    }
    [data-theme="light"] .staff-branding-icon {
      background: rgba(168, 126, 34, 0.12);
      border-color: rgba(168, 126, 34, 0.3);
      color: #A87E22;
    }
    [data-theme="light"] .staff-branding-title {
      color: #141A17 !important;
    }
    [data-theme="light"] .staff-branding-sub {
      color: #64748B !important;
    }
    [data-theme="light"] .staff-badge {
      background: rgba(168, 126, 34, 0.1);
      color: #926A18;
      border-color: rgba(168, 126, 34, 0.3);
    }
    [data-theme="light"] .staff-version-tag {
      color: #64748B;
    }
    [data-theme="light"] .staff-card-title {
      color: #141A17;
    }
    [data-theme="light"] .staff-card-desc {
      color: #4A5568;
    }
    [data-theme="light"] .form-group label {
      color: #2D3748;
    }
    [data-theme="light"] .form-group input,
    [data-theme="light"] .password-input-wrapper input {
      background: #F8FAFC;
      color: #141A17;
      border: 1.5px solid rgba(168, 126, 34, 0.35);
    }
    [data-theme="light"] .form-group input::placeholder,
    [data-theme="light"] .password-input-wrapper input::placeholder {
      color: #94A3B8;
    }
    [data-theme="light"] .form-group input:focus,
    [data-theme="light"] .password-input-wrapper input:focus {
      border-color: #A87E22;
      box-shadow: 0 0 0 3px rgba(168, 126, 34, 0.2);
    }
    [data-theme="light"] .password-toggle-btn {
      color: #64748B;
    }
    [data-theme="light"] .password-toggle-btn:hover {
      color: #926A18;
      background: rgba(168, 126, 34, 0.1);
    }
    [data-theme="light"] .alert-danger {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }
    [data-theme="light"] .alert-success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }
    [data-theme="light"] .return-link {
      color: #64748B;
    }
    [data-theme="light"] .return-link:hover {
      color: #0F172A;
    }

  </style>
</head>
<body>
  <!-- Dedicated Staff Theme Switcher Button -->
  <div style="position: fixed; top: 18px; right: 18px; z-index: 1000;">
    <button id="theme-toggle-btn" class="staff-theme-toggle" title="Switch between Dark and Light mode" aria-label="Toggle dark/light mode">
      <span class="theme-icon-slot">
        <svg id="theme-icon-sun" class="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none; width: 15px; height: 15px;"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg id="theme-icon-moon" class="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none; width: 15px; height: 15px;"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </span>
      <span id="theme-text-label" class="theme-text-label" style="font-size: 0.8rem; font-weight: 700;">Theme</span>
    </button>
  </div>


  <div class="staff-login-container">
    
    <!-- Branding Header -->
    <div style="text-align: center; margin-bottom: 24px;">
      <div class="staff-branding-icon">
        <svg xmlns="http://www.w3.org/2000/svg" style="width:28px;height:28px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <h1 class="staff-branding-title">ShopEase <span style="color: #d4af37;">Lanka</span></h1>
      <div class="staff-branding-sub">Internal Staff Operations Portal</div>
    </div>

    <!-- Login Card -->
    <div class="staff-card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span class="staff-badge">
          <svg style="width:13px;height:13px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          Authorized Personnel Only
        </span>
        <span class="staff-version-tag">v2.4 Secure</span>
      </div>

      <h2 class="staff-card-title">Sign In to Staff Console</h2>
      <p class="staff-card-desc">Enter your staff credentials to access your departmental control center.</p>

      <!-- Alert Message -->
      <div id="login-alert" class="alert-box"></div>

      <!-- Login Form -->
      <form id="staff-login-form" onsubmit="handleStaffLogin(event)" novalidate>
        <div class="form-group">
          <label for="staff-username">Staff Username or Email</label>
          <input 
            type="text" 
            id="staff-username" 
            placeholder="e.g. admin or sales_mgr" 
            autocomplete="username" 
            required 
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="staff-password">Secure Password</label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="staff-password" 
              placeholder="••••••••••••" 
              autocomplete="current-password" 
              required
            >
            <button 
              type="button" 
              id="toggle-password-btn" 
              class="password-toggle-btn" 
              onclick="togglePasswordVisibility()" 
              title="Show password" 
              aria-label="Show password"
            >
              <!-- Eye Open SVG (shown when password is hidden) -->
              <svg id="eye-icon-show" class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <!-- Eye Slashed SVG (shown when password is visible) -->
              <svg id="eye-icon-hide" class="eye-icon" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <button 
          type="submit" 
          id="staff-submit-btn" 
          class="primary-btn" 
          style="width: 100%; padding: 13px; font-size: 0.95rem; font-weight: 700; border-radius: 8px; margin-top: 8px; background: linear-gradient(135deg, #d4af37 0%, #b89228 100%); color: #070e0b; border: none; cursor: pointer; letter-spacing: 0.02em;"
        >
          Authenticate & Access Console →
        </button>
      </form>

    </div>

    <!-- Return to Storefront -->
    <div style="text-align: center;">
      <a href="/index.html" class="return-link">
        ← Return to Public Customer Storefront
      </a>
    </div>

  </div>

  <script src="/js/api.js"></script>
  <script>
    if (window.location.pathname.endsWith("/admin-login.html")) {
      window.history.replaceState(null, "", "/admin/login");
    }

    let isSubmitting = false;
    let isRedirecting = false;

    // Toggle Password Visibility (Eye Icon)
    function togglePasswordVisibility() {
      const pwdField = document.getElementById("staff-password");
      const eyeShow = document.getElementById("eye-icon-show");
      const eyeHide = document.getElementById("eye-icon-hide");
      const toggleBtn = document.getElementById("toggle-password-btn");

      if (!pwdField) return;

      if (pwdField.type === "password") {
        pwdField.type = "text";
        if (eyeShow) eyeShow.style.display = "none";
        if (eyeHide) eyeHide.style.display = "block";
        if (toggleBtn) {
          toggleBtn.title = "Hide password";
          toggleBtn.setAttribute("aria-label", "Hide password");
        }
      } else {
        pwdField.type = "password";
        if (eyeShow) eyeShow.style.display = "block";
        if (eyeHide) eyeHide.style.display = "none";
        if (toggleBtn) {
          toggleBtn.title = "Show password";
          toggleBtn.setAttribute("aria-label", "Show password");
        }
      }
      pwdField.focus();
    }

    // Auto-recover and re-enable form controls if the window lost/regained focus or desktop changed

    async function handleStaffLogin(e) {
      if (e && typeof e.preventDefault === "function") {
        e.preventDefault();
      }

      if (isSubmitting || isRedirecting) {
        return;
      }

      const alertBox = document.getElementById("login-alert");
      if (alertBox) alertBox.style.display = "none";

      const btn = document.getElementById("staff-submit-btn");
      const userField = document.getElementById("staff-username");
      const pwdField = document.getElementById("staff-password");

      const username = userField ? userField.value.trim() : "";
      const password = pwdField ? pwdField.value : "";

      if (!username) {
        if (alertBox) {
          alertBox.className = "alert-box alert-danger";
          alertBox.textContent = "Please enter your staff username or email.";
          alertBox.style.display = "block";
        }
        if (userField) userField.focus();
        return;
      }

      if (!password) {
        if (alertBox) {
          alertBox.className = "alert-box alert-danger";
          alertBox.textContent = "Please enter your secure password.";
          alertBox.style.display = "block";
        }
        if (pwdField) pwdField.focus();
        return;
      }

      isSubmitting = true;
      if (btn) {
        btn.disabled = true;
        btn.textContent = "Verifying Staff Credentials...";
      }

      // Timeout safety: 10 seconds max so the UI never hangs indefinitely
      const timeoutPromise = new Promise((_, reject) =>
        setTimeout(() => reject(new Error("Request timed out. Please check your connection or server status.")), 10000)
      );

      try {
        const loginPromise = API.auth.login(username, password);
        const response = await Promise.race([loginPromise, timeoutPromise]);
        const user = response;

        // Security Gatekeeper: Ensure user is an internal staff member
        if (!user || user.role === "CUSTOMER") {
          throw new Error("Access Denied: Customer accounts are not permitted in the internal staff console. Please visit the public storefront.");
        }

        isRedirecting = true;

        // Store staff session
        localStorage.setItem("shopease_user", JSON.stringify(user));
        if (user.token) {
          localStorage.setItem("shopease_token", user.token);
        }

        if (alertBox) {
          alertBox.className = "alert-box alert-success";
          alertBox.textContent = `Authentication Successful! Welcome, ${user.fullName || user.username} (${user.role}). Redirecting...`;
          alertBox.style.display = "block";
        }

        if (btn) {
          btn.textContent = "Redirecting to Management Console...";
        }

        setTimeout(() => {
          window.location.href = "/admin-dashboard.html";
        }, 600);

      } catch (err) {
        console.error("Staff login failed:", err);
        if (alertBox) {
          alertBox.className = "alert-box alert-danger";
          alertBox.textContent = err.message || "Invalid staff credentials. Please check your username and password.";
          alertBox.style.display = "block";
        }
      } finally {
        isSubmitting = false;
        if (!isRedirecting && btn) {
          btn.disabled = false;
          btn.textContent = "Authenticate & Access Console →";
        }
      }
    }

    // Ensure Enter key always triggers login smoothly
    document.addEventListener("DOMContentLoaded", () => {
      const userField = document.getElementById("staff-username");
      const pwdField = document.getElementById("staff-password");

      [userField, pwdField].forEach(field => {
        if (field) {
          field.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
              e.preventDefault();
              handleStaffLogin(e);
            }
          });
        }
      });
    });
  </script>
  <script src="/js/app.js"></script>
</body>
</html>
