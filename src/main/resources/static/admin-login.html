<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ShopEase Lanka Staff Back-Office Portal - Authorized employee login for operations, fulfillment, logistics, catalog, and CX management.">
  <title>Staff Back-Office Portal | ShopEase Lanka</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/product-storefront.css">
  <link rel="stylesheet" href="/css/base-components.css">
  <link rel="stylesheet" href="/css/product-details.css">
  <link rel="stylesheet" href="/css/review.css">
  <link rel="stylesheet" href="/css/order.css">
  <link rel="stylesheet" href="/css/delivery.css">
  <link rel="stylesheet" href="/css/admin-shell.css">
  <link rel="stylesheet" href="/css/user.css">
  <link rel="stylesheet" href="/css/inventory.css">
  <link rel="stylesheet" href="/css/base-overlays.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script>
    (function() {
      const saved = localStorage.getItem('shopease_theme') || localStorage.getItem('theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
      }
    })();
  </script>
  <link rel="stylesheet" href="/css/user-admin-login.css">
</head>
<body>
  <!-- Dedicated Staff Theme Switcher Button -->
  <div style="position: fixed; top: 18px; right: 18px; z-index: 1000;">
    <button id="theme-toggle-btn" class="staff-theme-toggle" title="Switch between Dark and Light mode" aria-label="Toggle dark/light mode">
      <span class="theme-icon-slot">
        <svg id="theme-icon-sun" class="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none; width: 15px; height: 15px;"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        <svg id="theme-icon-moon" class="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none; width: 15px; height: 15px;"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </span>
      <span id="theme-text-label" class="theme-text-label" style="font-size: 0.8rem; font-weight: 700;">Theme</span>
    </button>
  </div>


  <div class="staff-login-container">
    
    <!-- Branding Header -->
    <div style="text-align: center; margin-bottom: 24px;">
      <div class="staff-branding-icon">
        <svg xmlns="http://www.w3.org/2000/svg" style="width:28px;height:28px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <h1 class="staff-branding-title">ShopEase <span style="color: #d4af37;">Lanka</span></h1>
      <div class="staff-branding-sub">Internal Staff Operations Portal</div>
    </div>

    <!-- Login Card -->
    <div class="staff-card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span class="staff-badge">
          <svg style="width:13px;height:13px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          Authorized Personnel Only
        </span>
        <span class="staff-version-tag">v2.4 Secure</span>
      </div>

      <h2 class="staff-card-title">Sign In to Staff Console</h2>
      <p class="staff-card-desc">Enter your staff credentials to access your departmental control center.</p>

      <!-- Alert Message -->
      <div id="login-alert" class="alert-box"></div>

      <!-- Login Form -->
      <form id="staff-login-form" onsubmit="handleStaffLogin(event)" novalidate>
        <div class="form-group">
          <label for="staff-username">Staff Username or Email</label>
          <input 
            type="text" 
            id="staff-username" 
            placeholder="e.g. admin or sales_mgr" 
            autocomplete="username" 
            required 
            autofocus
          >
        </div>

        <div class="form-group">
          <label for="staff-password">Secure Password</label>
          <div class="password-input-wrapper">
            <input 
              type="password" 
              id="staff-password" 
              placeholder="••••••••••••" 
              autocomplete="current-password" 
              required
            >
            <button 
              type="button" 
              id="toggle-password-btn" 
              class="password-toggle-btn" 
              onclick="togglePasswordVisibility()" 
              title="Show password" 
              aria-label="Show password"
            >
              <!-- Eye Open SVG (shown when password is hidden) -->
              <svg id="eye-icon-show" class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <!-- Eye Slashed SVG (shown when password is visible) -->
              <svg id="eye-icon-hide" class="eye-icon" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <button 
          type="submit" 
          id="staff-submit-btn" 
          class="primary-btn" 
          style="width: 100%; padding: 13px; font-size: 0.95rem; font-weight: 700; border-radius: 8px; margin-top: 8px; background: linear-gradient(135deg, #d4af37 0%, #b89228 100%); color: #070e0b; border: none; cursor: pointer; letter-spacing: 0.02em;"
        >
          Authenticate & Access Console →
        </button>
      </form>

    </div>

    <!-- Return to Storefront -->
    <div style="text-align: center;">
      <a href="/index.html" class="return-link">
        ← Return to Public Customer Storefront
      </a>
    </div>

  </div>

  <script src="/js/api-core.js"></script>
  <script src="/js/user/api-user.js"></script>
  <script src="/js/product/api-catalog.js"></script>
  <script src="/js/inventory/api-inventory.js"></script>
  <script src="/js/order/api-orders.js"></script>
  <script src="/js/delivery/api-deliveries.js"></script>
  <script src="/js/review/api-review.js"></script>
  <script src="/js/user/admin-login-page.js"></script>
  <script src="/js/app-core.js"></script>
  <script src="/js/user/app-user.js"></script>
  <script src="/js/order/app-order.js"></script>
  <script src="/js/review/app-notifications.js"></script>
  <script src="/js/partials.js"></script>
</body>
</html>
