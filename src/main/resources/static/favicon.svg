<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3A2C"/>
      <stop offset="100%" stop-color="#051C13"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE08B"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9E740C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Luxury Emerald Squircle Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Subtle Inner Ring -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="11" fill="none" stroke="#D4AF37" stroke-width="0.75" stroke-opacity="0.35"/>

  <!-- Bag Handle Arch -->
  <path d="M25 24 C25 15, 39 15, 39 24" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Tote Bag Body -->
  <path d="M19 23 L45 23 L48.5 49 C48.8 51.5, 47 53.5, 44.5 53.5 L19.5 53.5 C17 53.5, 15.2 51.5, 15.5 49 Z" fill="#0A2C21" stroke="url(#goldGrad)" stroke-width="2.8" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Fold / Trim Accent Line -->
  <line x1="18.5" y1="28" x2="45.5" y2="28" stroke="url(#goldGrad)" stroke-width="1.8" stroke-opacity="0.8"/>

  <!-- Center Golden Ceylon Gem Star -->
  <path d="M32 32 L34 37 L39 39 L34 41 L32 46 L30 41 L25 39 L30 37 Z" fill="url(#goldGrad)" stroke="#FFE899" stroke-width="0.75"/>

  <!-- Star Sparkle Accent -->
  <circle cx="43" cy="18" r="1.5" fill="#FFE58F"/>
</svg>
